services:
  deepseek-harness:
    # 本地构建用 dsh-nas:latest; 用 GitHub Actions 推送的镜像则设置
    # DSH_IMAGE=ghcr.io/你的用户名/dsh-nas:latest
    image: ${DSH_IMAGE:-dsh-nas:latest}
    container_name: deepseek-harness
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "3080:3080"   # HTTP: 给 Cloudflare Tunnel 回源 / SSH 隧道 (免证书)
      - "8443:8443"   # HTTPS: 给局域网直连 (自签名, 首次点一次信任; 设置 HTTPS_ACCESS_HOST 才有)
    environment:
      # 登录页认证 (推荐必须设置, 尤其公网)
      DSH_AUTH_USERNAME: "${DSH_AUTH_USERNAME}"
      DSH_AUTH_PASSWORD: "${DSH_AUTH_PASSWORD}"
      # 设置这个才启用 8443 HTTPS (自签名证书, 浏览器首次访问点一次信任)
      # 填 NAS 的局域网 IP 或域名, 不带协议和端口, 如 192.168.1.100
      # 原因: dsh 前端用 crypto.randomUUID, 浏览器只在 HTTPS/localhost 提供
      HTTPS_ACCESS_HOST: "${HTTPS_ACCESS_HOST}"
      DSH_TELEMETRY_DISABLED: "1"
      # 可选: DSH_SESSION_DAYS: "7"   会话有效期天数
      # 可选: DSH_AUTH_DEBUG: "1"     登录调试日志
    volumes:
      # 数据目录 (含对话记录, 备份它!)
      - "${DSH_DATA_PATH}:/data/dsh"
      # 工作目录 (AI 干活的地方, 只放允许 AI 操作的目录)
      - "${WORKSPACE_PATH}:/workspace"
